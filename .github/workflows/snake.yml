name: Generate Snake Animation

on:
  # Se ejecuta todos los días a medianoche (UTC)
  schedule:
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente desde la pestaña Actions
  workflow_dispatch:
  # Se ejecuta cada vez que haces push a main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E0457B&color_dots=#FFF0F4,#FFE0E8,#FFC9D6,#FFB7C5,#F59BB5
            dist/github-snake-dark.svg?color_snake=#FF4D8D&color_dots=#2B1B25,#5C2A44,#9A3F6C,#E8A0BF,#FFB7C5

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
